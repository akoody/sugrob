name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Build
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          [ -n "$SIGN_IDENTITY" ] || unset SIGN_IDENTITY
          ./scripts/build_app.sh "${GITHUB_REF_NAME#v}"

      - name: Self-test
        # Hosted runners may have no usable display or Metal device.
        continue-on-error: true
        run: dist/Sugrob.app/Contents/MacOS/Sugrob --selftest

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "No Apple credentials configured, publishing an ad-hoc signed build."
            exit 0
          fi
          xcrun notarytool submit dist/Sugrob.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Sugrob.dmg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 dist/Sugrob.dmg dist/Sugrob.zip | tee dist/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/Sugrob.dmg dist/Sugrob.zip dist/SHA256SUMS.txt --generate-notes
